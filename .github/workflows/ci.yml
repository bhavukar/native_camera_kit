name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Analyze code
        run: |
          flutter analyze --fatal-infos
          cd example && flutter analyze --fatal-infos

      - name: Run unit tests
        run: |
          flutter test
          cd example && flutter test

      - name: Verify pub publish dry-run
        run: dart pub publish --dry-run

      - name: Build Android APK (Example)
        run: cd example && flutter build apk --debug

      - name: Build iOS Simulator (Example)
        run: cd example && flutter build ios --simulator --no-codesign
